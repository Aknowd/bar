baseURL = "https://<yourname>.github.io/"
languageCode = "ja"
title = "My Portfolio"
theme = "PaperMod"

paginate = 10

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true

[params.homeInfo]
title = "K's Portfolio"
content = """
電子ビーム技術・ナノマシン研究・高次元物理の理論構築を中心に活動しています。
研究記録、技術メモ、創作プロジェクトを公開しています。
"""

[[params.homeInfo.buttons]]
name = "研究ノート"
url = "/posts/"

[[params.homeInfo.buttons]]
name = "Project D.A.S.Q."
url = "/dasq/"

[[params.homeInfo.buttons]]
name = "GitHub"
url = "https://github.com/<yourname>"

[params.assets]
hero = "/images/Designer.png"
